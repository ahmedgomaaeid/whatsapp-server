version: "3.8"
services:
  whatsapp-worker:
    build: .
    container_name: whatsapp_worker_api
    ports:
      - "5000:5000"
      - "5900:5900"
      - "6080:6080"
    volumes:
      - ./assets:/app/assets
      - ./chrome_data:/data/chrome_profile # حفظ الجلسة
      - ./db:/app/db # حفظ قاعدة البيانات عشان الرسائل ما تضيعش لو قفلت السيرفر
      - ./uploads:/app/uploads # حفظ الصور المرفوعة
    environment:
      - TELEGRAM_BOT_TOKEN=8468365632:AAH6EBLPzQjzK-1dEfdms2UMg_ny3feo3SM
      - TELEGRAM_CHAT_ID=-1003053476393
    shm_size: "2gb"
    restart: unless-stopped
